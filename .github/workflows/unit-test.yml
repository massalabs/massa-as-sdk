name: Unit tests

on:
  push:
  workflow_call:

jobs:
  build:

    runs-on: ubuntu-latest

    permissions:
      contents: read

    steps:
    - name: Checkout code
      uses: actions/checkout@v3

    - name: Use Node.js
      uses: actions/setup-node@v3
      with:
        node-version: 18.x
        cache: 'npm'

    - name: Execute unit tests
      run: |
        npm ci
        npm run fmt:check
        npm run test:ci
